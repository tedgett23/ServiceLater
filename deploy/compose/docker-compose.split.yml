# Split deployment: same image, different roles. Scale each independently:
#   docker compose -f deploy/compose/docker-compose.split.yml up -d --scale api=3 --scale web=2
# Put your own load balancer / ingress in front; route /api and /ws to `api`, everything else to `web`
# (or leave `web` to proxy /api and /ws to SL_API_URL and point the LB at `web` only).
x-image: &image
  build: { context: ../.., dockerfile: Dockerfile }

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: servicelater
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: servicelater
    volumes: [pgdata:/var/lib/postgresql/data]

  api:
    <<: *image
    environment: &db
      SL_ROLES: api
      SL_DATABASE_URL: postgres://servicelater:${POSTGRES_PASSWORD}@db:5432/servicelater?sslmode=disable
    depends_on: [db]

  worker:
    <<: *image
    environment:
      <<: *db
      SL_ROLES: worker
    depends_on: [db]

  web:
    <<: *image
    environment:
      SL_ROLES: web
      SL_API_URL: http://api:8080
    ports: ["8080:8080"]
    depends_on: [api]

volumes:
  pgdata:

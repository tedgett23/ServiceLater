# Split deployment: same image, different roles. Scale each independently:
#   docker compose -f deploy/compose/docker-compose.split.yml up -d --scale api=3 --scale web=2
# Put your own load balancer / ingress in front; route /api and /ws to `api`, everything else to `web`
# (or leave `web` to proxy /api and /ws to SL_API_URL and point the LB at `web` only).
x-image: &image
  image: ${SL_IMAGE:-servicelater:latest}
  build: { context: ../.., dockerfile: Dockerfile }
  restart: unless-stopped

services:
  db:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_USER: servicelater
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: servicelater
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      # Over TCP: on its first start Postgres initialises behind a socket-only server that pg_isready alone calls ready.
      test: ["CMD-SHELL", "pg_isready -U servicelater -d servicelater -h 127.0.0.1"]
      interval: 5s
      retries: 10

  api:
    <<: *image
    environment: &db
      SL_ROLES: api
      SL_APPS_LOCAL_DIR: /data/apps-local   # the same local layer on every api and worker
      # Attachments kept in a folder (the default; Admin > Storage can switch to S3) must be the same folder on every
      # api and worker. A named volume is, on one host; across hosts, mount shared storage (NFS, EFS) or use S3.
      SL_ATTACHMENTS_DIR: /data/attachments
      SL_JWT_SECRET: ${SL_JWT_SECRET:?set in .env (openssl rand -base64 48)}  # identical on every api replica
      # Encrypts stored secrets such as the mail server password (servicelater secrets gen-key). Every api and worker needs the same one.
      SL_SECRETS_KEY: ${SL_SECRETS_KEY:-}
      SL_BOOTSTRAP_ADMIN_EMAIL: ${SL_BOOTSTRAP_ADMIN_EMAIL:-}
      SL_BOOTSTRAP_ADMIN_PASSWORD: ${SL_BOOTSTRAP_ADMIN_PASSWORD:-}
      SL_DATABASE_URL: postgres://servicelater:${POSTGRES_PASSWORD}@db:5432/servicelater?sslmode=disable
    volumes: [apps-local:/data/apps-local, attachments:/data/attachments]
    depends_on:
      db: { condition: service_healthy }

  worker:
    <<: *image
    environment:
      <<: *db
      SL_ROLES: worker
    volumes: [apps-local:/data/apps-local, attachments:/data/attachments]
    depends_on:
      db: { condition: service_healthy }

  web:
    <<: *image
    environment:
      SL_ROLES: web
      SL_API_URL: http://api:8080
    ports: ["8080:8080"]
    depends_on: [api]

volumes:
  pgdata:
  apps-local:
  attachments:

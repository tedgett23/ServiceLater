apiVersion: 1
name: problem-management
version: 0.1.0
author: ServiceLater
description: "Problems behind incidents: root cause, workarounds and known errors, and resolving linked incidents with the fix."
ServiceLater_min_version: 0.1.0
# Incidents and their resolution are core; the status they are resolved to (resolved) is incident-management's,
# checked when the rule runs, so this app works with any incident lifecycle that has it and does not depend on one.
dependencies:
  - core-itsm: ">=0.1.0"
# What the app itself may do when a problem changes: read the problem, and tell and resolve the incidents linked to it.
permissions:
  - records:read:problem
  - records:read:incident
  - records:update:incident

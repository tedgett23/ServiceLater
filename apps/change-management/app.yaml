apiVersion: 1
name: change-management
version: 0.5.0
author: ServiceLater
description: "Change requests with approval workflows, risk assessment and change calendar."
ServiceLater_min_version: 0.1.0
dependencies:
  - core-itsm: ">=0.1.0"
# What the app itself may do when its workflows act for someone: move changes on after a board decides, say so, and
# leave an internal note when nobody could decide.
permissions:
  - records:read:change
  - records:update:change
  - comments:internal

kind: role
name: change-manager
label: Change manager
description: "Runs the change process: sees, files and edits changes, writes internal notes, starts and follows change workflows, and declares change freezes. Reads the CMDB, so it can link items and see the freezes that apply to them."
permissions:
  - records:read:change
  - records:create:change
  - records:update:change
  - comments:internal
  - workflows:read_all
  - workflows:run
  - users:read
  - cmdb:read
  - freezes:manage

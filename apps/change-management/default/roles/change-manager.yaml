kind: role
name: change-manager
label: Change manager
description: "Runs the change process: sees and edits tickets, writes internal notes, starts and follows change workflows. Until change records exist this covers all tickets; it narrows to changes when they arrive."
permissions:
  - tickets:read_all
  - tickets:update
  - comments:internal
  - workflows:read_all
  - workflows:run
  - users:read

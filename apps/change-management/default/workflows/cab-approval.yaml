# Asks the change advisory board (everyone holding the cab-member role) to authorize a normal change. A majority
# decides; with no decision in five days the change goes back to Assess. Started by rules/ask-the-board.yaml.
kind: workflow
name: cab-approval
record_type: change
start: board
steps:
  board:
    type: condition
    if: size(role('cab-member')) > 0
    then: ask
    else: nobody
  ask:
    type: approval
    approvers: role('cab-member')
    rule: majority
    timeout: 5d
    on_timeout: expired
    next: still_waiting
  still_waiting:
    type: condition
    if: record.status == "authorize"
    then: decided
    else: done
  decided:
    type: condition
    if: vars.ask_decision == "approved"
    then: authorized
    else: rejected
  authorized:
    type: record.transition
    to: scheduled
    next: say_authorized
  say_authorized:
    type: comment.add
    body: '="Authorized by the change advisory board." + (vars.ask_comment != "" ? " " + vars.ask_comment : "")'
    next: done
  rejected:
    type: record.transition
    to: assess
    next: say_rejected
  say_rejected:
    type: comment.add
    body: '="The change advisory board did not authorize this change." + (vars.ask_comment != "" ? " " + vars.ask_comment : "")'
    next: done
  expired:
    type: condition
    if: record.status == "authorize"
    then: send_back
    else: done
  send_back:
    type: record.transition
    to: assess
    next: say_expired
  say_expired:
    type: comment.add
    body: The change advisory board did not decide within five days, so the change is back in Assess.
    next: done
  nobody:
    type: record.transition
    to: assess
    next: say_nobody
  say_nobody:
    type: comment.add
    body: Nobody holds the CAB member role, so nobody could authorize this change. Grant the role, then request authorization again.
    internal: true
    next: done
  done:
    type: end
